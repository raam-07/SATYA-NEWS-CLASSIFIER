name: Recheck categories (tech, India angle)

# Re-asks the model for the category and the India angle of stories that are already classified.
# dry_run=true changes nothing and saves the answers to the core repo's run-logs-classifier branch.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Comma-separated article ids (instead of days)'
        required: false
        default: ''
      days:
        description: 'Stories from the last N days'
        required: false
        default: '7'
      dry_run:
        description: 'true = change nothing, only save the answers'
        required: false
        default: 'true'
      ref:
        description: 'Code branch'
        required: false
        default: 'main'
      shards:
        description: 'Parallel runners (1-13)'
        required: false
        default: '13'

concurrency:
  group: classifier-recheck
  cancel-in-progress: false

env:
  CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
  PYTHONPATH: ${{ github.workspace }}/.ci

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: python3 -c "n=max(1,min(13,int('${{ github.event.inputs.shards }}' or 13))); print('shards='+str(list(range(n))))" >> $GITHUB_OUTPUT

  recheck:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: ${{ github.event.inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          pip install --upgrade pip
          pip install gspread oauth2client huggingface_hub libsql
          CMAKE_ARGS="-DLLAMA_AVX=OFF -DLLAMA_AVX2=OFF -DLLAMA_FMA=OFF -DLLAMA_F16C=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF" pip install llama-cpp-python --no-binary llama-cpp-python --no-cache-dir
      - name: Cache model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ./models
          key: gemma-4-12b-q4-v1
      - name: Download model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./models
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='unsloth/gemma-4-12b-it-GGUF', filename='gemma-4-12b-it-Q4_K_M.gguf', local_dir='./models')"
      - name: Recheck
        env:
          SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
          SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
          SHARD_ID: ${{ matrix.shard }}
          NUM_SHARDS: ${{ strategy.job-total }}
        run: |
          DRY=""; [ "${{ github.event.inputs.dry_run }}" = "false" ] || DRY="--dry-run"
          if [ -n "${{ github.event.inputs.ids }}" ]; then SEL="--recheck-ids ${{ github.event.inputs.ids }}"; else SEL="--recheck-days ${{ github.event.inputs.days }}"; fi
          python satya.py $SEL $DRY --shard $SHARD_ID --num-shards $NUM_SHARDS --out recheck-$SHARD_ID.jsonl
      - name: Save answers
        if: always()
        run: |
          [ -s recheck-${{ matrix.shard }}.jsonl ] || exit 0
          B=run-logs-classifier; D=recheck/${{ github.run_id }}
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          mkdir -p /tmp/out && cp recheck-${{ matrix.shard }}.jsonl /tmp/out/
          for i in 1 2 3 4 5; do
            if git fetch -q origin $B 2>/dev/null; then git checkout -qf -B $B FETCH_HEAD
            else git checkout -q --orphan $B; git rm -rq --cached . >/dev/null 2>&1 || true; fi
            mkdir -p $D && cp /tmp/out/recheck-${{ matrix.shard }}.jsonl $D/
            git add $D && git commit -qm "recheck ${{ github.run_id }} shard ${{ matrix.shard }}" && git push -q origin HEAD:$B && break
            sleep $((RANDOM % 10 + 3))
          done

  refresh-site:
    needs: recheck
    if: always() && github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the site's story lists
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          [ -n "$REVALIDATE_SECRET" ] || exit 0
          curl -s -o /dev/null -w "revalidate %{http_code}\n" -A "SatyaDheesh-Orchestrator/1.0" "https://satyadheesh.in/api/revalidate?secret=$REVALIDATE_SECRET" || true
